name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установка зависимостей
        run: pip install -e ".[dev,web]"
      - name: Проверка кода (pyflakes)
        run: python -m pyflakes rag eval tests parser.py institutes_summary.py
      - name: Тесты
        run: python -m pytest -q
